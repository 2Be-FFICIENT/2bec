name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "examples/**"
      - ".github/dependabot.yml"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "examples/**"
      - ".github/dependabot.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: short

permissions:
  contents: read

jobs:
  lint:
    name: Format & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: shellcheck the installer
        run: shellcheck install/install.sh install/test.sh
      - name: Parse the PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [Management.Automation.Language.Parser]::ParseFile("$PWD/install/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Install from a fake release feed
        run: bash install/test.sh

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny --locked check

  # Pull requests test one platform per operating system; pushes to main
  # and tags run the full matrix.
  platforms:
    name: Pick the platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        run: |
          core='[
            {"name":"linux-x64","os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},
            {"name":"macos-arm64","os":"macos-latest","target":"aarch64-apple-darwin"},
            {"name":"windows-x64","os":"windows-latest","target":"x86_64-pc-windows-msvc"}'
          extra=',
            {"name":"linux-arm64","os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"},
            {"name":"macos-x64","os":"macos-15-intel","target":"x86_64-apple-darwin"},
            {"name":"windows-arm64","os":"windows-11-arm","target":"aarch64-pc-windows-msvc"}'
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            matrix="$core]"
          else
            matrix="$core$extra]"
          fi
          echo "matrix=$(jq -c . <<< "$matrix")" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.name }})
    needs: platforms
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Smoke test the binary
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/debug/2bec"
          [[ "${{ runner.os }}" == "Windows" ]] && bin="$bin.exe"
          "$bin" --version
          "$bin" --help

  ci-ok:
    name: CI passed
    if: always()
    needs: [lint, deny, platforms, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          echo '${{ toJSON(needs) }}'
          [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "false" ]]
