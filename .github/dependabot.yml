# Weekly dependency updates. Minor and patch bumps are grouped into one pull
# request per ecosystem; major bumps stay separate since they may need code
# changes.

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        update-types: [minor, patch]
