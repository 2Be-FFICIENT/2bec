# cargo-deny policy, checked in CI (`cargo deny check`).
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
# Only the platforms CI and the release pipeline build for; crates pulled in
# for other targets (wasm32, android) never reach a shipped binary.
targets = [
    "aarch64-apple-darwin",
    "aarch64-pc-windows-msvc",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
]
# Release builds turn on the keyring feature, so check its crates too.
all-features = true

[advisories]
# Fail on any RustSec advisory (vulnerable, unmaintained, unsound or yanked)
# affecting a crate in Cargo.lock. Silence one only with a reason:
# ignore = [{ id = "RUSTSEC-YYYY-NNNN", reason = "..." }]
ignore = []

[licenses]
# Licenses compatible with shipping an Apache-2.0 binary. Every new license
# also needs its text in THIRD-PARTY-NOTICES.md.
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions cost build time and binary size but are often
# unavoidable; report them without failing.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
