[package]
name = "twobec"
version = "0.1.0"
edition = "2024"
description = "Command-line client for the 2Be-FFICIENT API"
license = "Apache-2.0"

[[bin]]
name = "2bec"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
getrandom = "0.4.3"
open = "5.4.4"
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "form", "gzip", "http2", "json", "query", "rustls"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
toml = "1.1.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
wiremock = "0.6.5"
