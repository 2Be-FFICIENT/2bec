[package]
name = "twobec"
version = "0.1.0"
edition = "2024"
description = "Command-line client for the 2Be-FFICIENT API"
license = "Apache-2.0"
repository = "https://github.com/2Be-FFICIENT/2bec"

[[bin]]
name = "2bec"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
dirs = "7.0.0"
getrandom = "0.4.3"
keyring = { version = "4.2.0", optional = true }
open = "5.4.4"
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "form", "gzip", "http2", "json", "query", "rustls"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
toml = "1.1.8"

# Line tables are enough for readable backtraces and cut link time and the
# CI cache size; full debug info is one `CARGO_PROFILE_DEV_DEBUG=2` away.
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
wiremock = "0.6.5"

[features]
keyring = ["dep:keyring"]

[target."cfg(unix)".dependencies]
libc = "0.2.190"
