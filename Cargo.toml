[package]
name = "twobec"
version = "0.1.0"
edition = "2024"
description = "Command-line client for the 2Be-FFICIENT API"
license = "Apache-2.0"

[[bin]]
name = "2bec"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "gzip", "http2", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
toml = "1.1.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
